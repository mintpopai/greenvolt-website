# greenvolt 官网 —— 工具链与命令的唯一来源
# 版本一律钉死，保证环境可复现；所有日常命令走 `mise run <task>`

[tools]
node = "24.19.0"
pnpm = "11.20.0"

# —— 安装 ——

[tasks.install]
description = "安装项目依赖"
usage = '''
flag "--frozen" help="按 lockfile 精确安装、不更新 lockfile（CI/Docker 用）"
'''
run = "pnpm install ${usage_frozen:+--frozen-lockfile}"

# —— 运行 ——

[tasks.run]
description = "启动本地开发服务器"
run = "pnpm vite"

[tasks.preview]
description = "本地预览构建产物"
run = "pnpm vite preview"

# —— 构建 ——

[tasks.build]
description = "类型检查并构建生产产物到 dist/"
run = ["pnpm vue-tsc --noEmit -p tsconfig.app.json", "pnpm vite build"]

# —— 质量 ——

[tasks.lint]
description = "类型检查（不产出构建物）"
run = "pnpm vue-tsc --noEmit -p tsconfig.app.json"
