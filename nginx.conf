server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 重定向发相对 Location，避免 nginx 用 $host 拼绝对地址时丢掉端口 / 协议
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # 带内容指纹的构建产物，可长期强缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口文档不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /legal.html {
        add_header Cache-Control "no-cache";
    }

    # 尾斜杠归一到 /legal，否则 /legal/ 会一路落到 SPA 入口、静默显示首页
    location = /legal/ {
        return 301 /legal;
    }

    # $uri.html 让 /legal 直接命中独立的 legal.html；其余路径仍回落到 SPA 入口
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
