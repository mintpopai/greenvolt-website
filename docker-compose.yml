# 部署：拉 GHCR 上 CI 已发布的镜像运行；本地构建镜像走 mise run image，不归 compose 管
# 私有镜像需先在部署机执行 docker login ghcr.io
services:
  web:
    image: ghcr.io/mintpopai/greenvolt-website:${APP_TAG:-latest}
    container_name: greenvolt-website
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
