name: Release

on:
  push:
    tags: ["v*.*.*"]
  # 手动逃生口：紧急重推镜像 / 回滚验证
  workflow_dispatch:

permissions:
  contents: read

# 两次 tag 同时推镜像会互相覆盖，串行且不取消已在跑的
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 发版前门禁：本仓直推 main，不能只靠 PR 触发的 CI 拦截，必须在发版链路里再过一次
  verify:
    name: 质量门禁
    uses: ./.github/workflows/quality.yml

  build-push:
    name: 构建并推送镜像
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # 单架构（runner 本机 amd64），不需要 QEMU；Buildx 仍必须有：gha 层缓存与
      # Dockerfile.dockerignore 都依赖 BuildKit
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,enable=${{ github.ref_type != 'tag' }}
          flavor: |
            latest=auto

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: 创建 GitHub Release
    needs: build-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # COMMIT 模式的变更日志需要全量历史

      # 比较起点自己用 git 算（内置版本序天然懂 v0.10.0 > v0.9.0），不让 action 自行解析
      - name: 解析上一版 tag
        id: prev
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev="$(git tag -l 'v*' --sort=-v:refname \
            | awk -v cur="$TAG" 'f { print; exit } $0 == cur { f = 1 }')"
          if [ -z "$prev" ]; then
            prev="$(git rev-list --max-parents=0 HEAD | tail -1)" # 首发：起点取初始提交
          fi
          echo "from=$prev" >> "$GITHUB_OUTPUT"

      - name: 生成变更日志
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: COMMIT
          fromTag: ${{ steps.prev.outputs.from }}
          toTag: ${{ github.ref_name }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "label_extractor": [
                {
                  "pattern": "^(feat|fix|perf|refactor|revert|build|chore|ci|docs|style|test)[^:]*:.*",
                  "target": "$1",
                  "on_property": "title"
                }
              ],
              "categories": [
                { "title": "### ✨ 新功能", "labels": ["feat"] },
                { "title": "### 🐛 问题修复", "labels": ["fix"] },
                { "title": "### ⚡ 性能优化", "labels": ["perf"] },
                { "title": "### ♻️ 重构", "labels": ["refactor"] },
                { "title": "### ⏪ 回滚", "labels": ["revert"] }
              ]
            }

      # annotated tag 的注释置顶，其下接分类后的变更日志；两者都空时补占位文案
      - name: 组装发布说明
        env:
          TAG: ${{ github.ref_name }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          # actions/checkout 检出 tag 时会用 +<commit>:refs/tags/<tag> 覆写本地 ref，
          # 把 annotated tag 降级成轻量 tag，注释随之丢失；这里强制取回真正的 tag 对象
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          : > notes.md
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" >> notes.md
            printf '\n\n' >> notes.md
          fi
          printf '%s\n' "$CHANGELOG" >> notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "- 本次无面向用户的变更" > notes.md
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GreenVolt 官网 ${{ github.ref_name }}
          body_path: notes.md
