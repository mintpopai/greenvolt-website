name: Release

on:
  push:
    tags: ["v*.*.*"]
  # 手动逃生口：紧急重推镜像 / 回滚验证
  workflow_dispatch:

permissions:
  contents: read

# 两次 tag 同时推镜像会互相覆盖，串行且不取消已在跑的
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 发版前门禁：本仓直推 main，不能只靠 PR 触发的 CI 拦截，必须在发版链路里再过一次
  verify:
    name: 质量门禁
    uses: ./.github/workflows/quality.yml

  build-push:
    name: 构建并推送镜像
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 单架构（runner 本机 amd64），不需要 QEMU；Buildx 仍必须有：gha 层缓存与
      # Dockerfile.dockerignore 都依赖 BuildKit
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,enable=${{ github.ref_type != 'tag' }}
          flavor: |
            latest=auto

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: 创建 GitHub Release
    needs: build-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # COMMIT 模式的变更日志需要全量历史

      # 比较起点自己用 git 算（内置版本序天然懂 v0.10.0 > v0.9.0），不让 action 自行解析
      - name: 解析上一版同前缀稳定 tag
        id: prev
        env:
          PREFIX: ""
          TAG: ${{ github.ref_name }}
        run: |
          # shallow clone 下 describe 会静默失准，宁可中止也不产出一份错的变更日志
          [ "$(git rev-parse --is-shallow-repository)" = "false" ] \
            || { echo "::error::仓库是 shallow clone，checkout 需 fetch-depth: 0" >&2; exit 1; }
          # 按提交拓扑回溯最近的同前缀稳定 tag：
          #   --match   只认本组件、v 后跟数字的 tag        --exclude 排除预发布（如 v0.2.0-rc.1）
          #   ${TAG}^ 从父提交起找，同 commit 上别的组件 tag 不会干扰
          prev="$(git describe --tags --abbrev=0 \
            --match "${PREFIX}v[0-9]*" --exclude "${PREFIX}v*-*" "${TAG}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            # 没找到时区分「真首发」与「异常」，绝不一律退成全量历史
            others="$(git tag -l "${PREFIX}v[0-9]*" \
              | grep -E "^${PREFIX}v[0-9]+\.[0-9]+\.[0-9]+$" | grep -vFx "${TAG}" || true)"
            if [ -n "$others" ]; then
              echo "::error::存在同前缀稳定 tag 却回溯不到上一版，疑似 tag 不在当前历史或未拉全" >&2
              printf '%s\n' "$others" >&2
              exit 1
            fi
            prev="$(git rev-list --max-parents=0 "${TAG}" | tail -1)"   # 真首发：起点取初始提交
            echo "首发，起点取初始提交 ${prev}" >&2
          fi
          echo "起点 ${prev} → 终点 ${TAG}" >&2
          echo "from=$prev" >> "$GITHUB_OUTPUT"

      - name: 生成变更日志
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: COMMIT
          fromTag: ${{ steps.prev.outputs.from }}
          toTag: ${{ github.ref_name }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "label_extractor": [
                {
                  "pattern": "^(feat|fix|perf|refactor|revert|build|chore|ci|docs|style|test)[^:]*:.*",
                  "target": "$1",
                  "on_property": "title"
                }
              ],
              "categories": [
                { "title": "### ✨ 新功能", "labels": ["feat"] },
                { "title": "### 🐛 问题修复", "labels": ["fix"] },
                { "title": "### ⚡ 性能优化", "labels": ["perf"] },
                { "title": "### ♻️ 重构", "labels": ["refactor"] },
                { "title": "### ⏪ 回滚", "labels": ["revert"] }
              ]
            }

      # annotated tag 的注释置顶，其下接分类后的变更日志；两者都空时补占位文案
      - name: 组装发布说明
        env:
          TAG: ${{ github.ref_name }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          : > notes.md
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" >> notes.md
            printf '\n\n' >> notes.md
          fi
          printf '%s\n' "$CHANGELOG" >> notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "- 本次无面向用户的变更" > notes.md
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: GreenVolt 官网 ${{ github.ref_name }}
          body_path: notes.md
