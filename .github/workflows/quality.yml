name: Quality

# 可复用质量门禁：被 CI（合并前）与 Release（发版前）共用，两处永远是同一份定义
on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # mise-action 默认已跑 mise install 装 [tools]（node/pnpm），无需再写一步
      - name: 安装工具链
        uses: jdx/mise-action@v4

      - name: 安装项目依赖
        run: mise run install --frozen

      # build task 本身就是「vue-tsc 类型检查 + vite build」，类型不过或构建失败即中断
      - name: 类型检查并构建
        run: mise run build
